name: Tests

# The release workflow runs the test suite only on a tag push. This workflow runs
# it on every push and pull request, so a broken test shows before a release.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Run tests
        run: uv run pytest -v
